[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeserve"
version = "0.1.0"
description = "LLM Inference Engine"
readme = "README.md"
authors = [
  {name = "Danish Shaikh", email = "shaikhdanish.sd06@gmail.com"}
]
maintainers = [
  {name = "Danish Shaikh", email = "shaikhdanish.sd06@gmail.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "torchaudio==2.8.0",
  "transformers==4.56.0",
  "accelerate==1.10.1",
  "sentencepiece==0.2.1",
  "safetensors==0.6.2",
]
requires-python = ">= 3.11,<3.12"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "pytest",
    "pytest-cov",
]
typecheck = [
    "mypy",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.urls]
bugs = "https://github.com/danishshaikh06/forgeserve/issues"
changelog = "https://github.com/danishshaikh06/forgeserve/releases"
documentation = "https://danishshaikh06.github.io/forgeserve/"
homepage = "https://github.com/danishshaikh06/forgeserve"

[project.scripts]
forgeserve = "forgeserve.cli:app"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_errors = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
branch = true
parallel = true
source = ["forgeserve"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

 
